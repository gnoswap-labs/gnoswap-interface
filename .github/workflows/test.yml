name: Test
on:
  push:
    branches: [develop, staging, main]
  pull_request:

jobs:
  typecheck-web:
    name: Run type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup
      - run: yarn install --immutable
      - run: yarn workspace @gnoswap-labs/web typecheck

  lint-web:
    name: Run lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup
      - run: yarn install --immutable
      - run: yarn workspace @gnoswap-labs/web lint

  sonar-acitons:
    name: Scan project by Sonar Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Action
        uses: ./.github/actions/setup

      - name: Install Dependencies
        run: yarn

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  unit-tests-web:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Action
        uses: ./.github/actions/setup

      - name: Install Dependencies
        run: yarn

      - name: Run Test
        run: yarn workspace @gnoswap-labs/web test:ci

  build-tests:
    name: Run build tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: yarn
      - run: yarn workspace @gnoswap-labs/web build

  # TODO: Apply when you're done setting up your storybook environment
  # storybook-tests:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v3
  #     - uses: ./.github/actions/setup
  #     - run: yarn workspace @gnoswap-labs/web test-storybook
